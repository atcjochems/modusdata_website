<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SAP and Azure AI ticket classification architecture</title>
  <desc id="desc">A blue SAP S/4HANA and BTP system connects across a secure bridge to one Azure Container App running a LangGraph pipeline with rules, vector preselection, and LLM classification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#102d3b"/></linearGradient>
    <linearGradient id="sap" x1="0" x2="1"><stop stop-color="#1d5fa7"/><stop offset="1" stop-color="#67b7ed"/></linearGradient>
    <linearGradient id="azure" x1="0" x2="1"><stop stop-color="#087b8c"/><stop offset="1" stop-color="#22d3a6"/></linearGradient>
    <linearGradient id="bridge" x1="0" x2="1"><stop stop-color="#65b7ef"/><stop offset="1" stop-color="#21d3a5"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity=".16" stroke="#9ed8ed"><path d="M0 560H1200M0 610H1200M90 0V675M220 0V675M980 0V675M1110 0V675"/></g>
  <g transform="translate(70 140)">
    <path d="M0 360 200 260 400 360 200 470Z" fill="#123c66" stroke="#73c6f2" stroke-width="3"/>
    <path d="M30 355 200 275 370 355 200 435Z" fill="url(#sap)" opacity=".72"/>
    <g fill="#b8e5ff" stroke="#16609a" stroke-width="3">
      <path d="M72 170 200 105 328 170 200 235Z"/><path d="M72 170V350L200 415V235Z"/><path d="M328 170V350L200 415V235Z"/>
    </g>
    <g fill="#0a3760" stroke="#8ed7ff" stroke-width="2"><rect x="105" y="190" width="45" height="110"/><rect x="178" y="220" width="45" height="110"/><rect x="251" y="190" width="45" height="110"/></g>
    <g fill="#f6c75e"><circle cx="128" cy="214" r="5"/><circle cx="201" cy="244" r="5"/><circle cx="274" cy="214" r="5"/></g>
    <text x="200" y="65" fill="#c7ecff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">SAP S/4HANA + SAP BTP</text>
    <text x="200" y="505" fill="#8db7d4" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Clean Core system of record</text>
  </g>
  <g filter="url(#glow)" stroke="url(#bridge)" stroke-width="12" fill="none"><path d="M430 375H770"/><path d="M460 350H740" stroke-width="3"/><path d="M460 400H740" stroke-width="3"/></g>
  <g fill="#f7cf65"><circle cx="500" cy="375" r="7"/><circle cx="590" cy="375" r="7"/><circle cx="680" cy="375" r="7"/></g>
  <text x="600" y="330" fill="#b6f4e5" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">mTLS / OAuth JWT</text>
  <g transform="translate(760 115)">
    <path d="M0 410 185 500 370 410 185 325Z" fill="#073f4b" stroke="#25d8b4" stroke-width="3"/>
    <rect x="15" y="95" width="340" height="315" rx="18" fill="url(#azure)" opacity=".28" stroke="#54efd0" stroke-width="3"/>
    <text x="185" y="60" fill="#73f3d3" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Azure Container App / LangGraph</text>
    <g fill="#062d3c" stroke="#5ae2cf" stroke-width="2"><rect x="35" y="145" width="90" height="160" rx="10"/><rect x="140" y="145" width="90" height="160" rx="10"/><rect x="245" y="145" width="90" height="160" rx="10"/></g>
    <g fill="#b8fff1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"><text x="80" y="180">RULES</text><text x="185" y="180">VECTOR</text><text x="290" y="180">LLM + INSTRUCTOR</text><text x="80" y="201">First</text><text x="185" y="201">Preselect</text><text x="290" y="201">Schema output</text></g>
    <g stroke="#63f4d0" stroke-width="3" fill="none"><path d="M125 225H140M230 225H245"/><path d="M80 240v35M185 240v35M290 240v35"/></g>
    <g fill="#f6c75e"><circle cx="80" cy="245" r="6"/><circle cx="185" cy="245" r="6"/><circle cx="290" cy="245" r="6"/></g>
    <text x="185" y="465" fill="#b6f4e5" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Private VNet to vLLM GPU inference</text>
  </g>
  <text x="600" y="635" fill="#7195aa" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Decoupled side-by-side extensibility for enterprise support operations</text>
</svg>